name: Refresh World Metrics data

on:
  workflow_dispatch:
  schedule:
    # 20:30 Asia/Kolkata, after Indian market data is normally published.
    - cron: '0 15 * * *'

permissions:
  contents: write

concurrency:
  group: world-metrics-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: backend
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install collectors
        run: |
          python -m pip install -r backend/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check update and parsing safeguards
        run: |
          python -m unittest discover -s backend/tests -p 'test_cloud_refresh.py'
          python -m unittest discover -s backend/tests -p 'test_published_releases.py'
      - name: Collect published data
        id: collect
        continue-on-error: true
        run: python -m app.pipelines.cloud_refresh --data-dir published-data
      - name: Publish validated figures and source status
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: |
          test -s published-data/snapshot.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- published-data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh published World Metrics figures [skip ci]'
            git push origin HEAD:main
          fi
      - name: Retain run output for diagnosis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-metrics-data-${{ github.run_id }}
          path: published-data/*.json
          retention-days: 7
      - name: Report source failures
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Some source checks failed. Successful updates and previously verified figures were preserved; see snapshot.json source statuses.'
          exit 1
